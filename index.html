<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- บังคับไม่ให้ซูม เพื่อให้เหมือนแอปพลิเคชัน -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แอพทีวีรองรับรีโมท</title>
    <style>
        :root {
            --focus-color: #00ffcc;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* ป้องกันการเลื่อนหน้าจอด้วยเมาส์ */
        }

        /* โครงสร้างหน้าจอ */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        header {
            padding: 20px 40px;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        /* คลาสสำหรับปุ่มที่สามารถถูกโฟกัสด้วยรีโมทได้ */
        .focusable {
            border: 4px solid transparent;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        /* เมื่อรีโมทเลื่อนมาโฟกัสที่จุดนี้ */
        .focusable.focused {
            border-color: var(--focus-color);
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--focus-color);
            outline: none; /* ซ่อน outline ปกติของเบราว์เซอร์ */
        }

        #fullscreen-btn {
            padding: 10px 20px;
            background-color: #3b82f6;
            color: white;
            font-size: 16px;
            border-radius: 8px;
        }

/* 1. จัดการพื้นที่แสดงผลหลักให้เป็น Grid แนวนอน (เหมาะสำหรับ Android TV) */
#content-grid {
    display: flex;
    gap: 20px;
    padding: 20px;
    overflow-x: auto; /* ป้องกันการล้นแนวตั้ง ให้เลื่อนซ้ายขวาแทน */
}

/* 2. กำหนดขนาดที่แน่นอนให้กับการ์ด และซ่อนส่วนที่เกิน */
.video-card {
    position: relative;
    width: 320px;         /* กำหนดความกว้างของการ์ด */
    height: 180px;        /* กำหนดความสูงของการ์ด (สัดส่วน 16:9) */
    border-radius: 12px;  /* ทำมุมโค้งมน */
    overflow: hidden;     /* สั่งซ่อนภาพส่วนที่ล้นออกนอกตัวการ์ด */
    background-color: #202020;
    cursor: pointer;
    box-sizing: border-box;
    transition: transform 0.2s, border 0.2s;
}

/* เอฟเฟกต์เมื่อโฟกัสการ์ด */
.video-card:focus {
    transform: scale(1.05);
    outline: none;
    border: 3px solid #ffffff; /* เส้นขอบเด่นชัดขึ้นเมื่อกดรีโมทมาโดน */
}

/* 3. บังคับให้รูปภาพมีขนาดพอดีกับการ์ดเสมอ ไม่ว่ารูปจริงจะใหญ่แค่ไหน */
.video-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;    /* บังคับภาพขยายเต็มพื้นที่การ์ด โดยไม่เสียสัดส่วน */
    display: block;
}

/* 4. จัดวางตัวหนังสือให้อยู่ด้านบนหรือด้านล่างภาพ (เลือกตามชอบ) */
.card-title {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.8)); /* เงาดำจางๆ ช่วยให้เห็นอักษรชัด */
    color: white;
    font-size: 16px;
    margin: 0;
}


        #message-box {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <h1>ตัวอย่างแอป Android TV</h1>
            <!-- ใส่ tabindex เพื่อให้กดโฟกัสได้ -->
            <button id="fullscreen-btn" class="focusable" tabindex="0">เข้าสู่โหมดเต็มจอ</button>
        </header>

 <div id="content-grid">
    <!-- การ์ดที่ 1: ใส่รูปภาพประกอบ -->
    <div class="focusable video-card" tabindex="0" data-id="1" data-url="https://www.google.com/">
        <img src="https://raw.githubusercontent.com/Nebiela/playeriptv/refs/heads/main/gg.jpg" alt="Thumbnail 1" class="card-thumb">
        <div class="card-title">เข้าเว็บ</div>
    </div>
    
    <!-- การ์ดที่ 2: ใส่รูปภาพประกอบ -->
    <div class="focusable video-card" tabindex="0" data-id="2" data-url="https://www.youtube.com/">
        <img src="https://raw.githubusercontent.com/Nebiela/playeriptv/refs/heads/main/YT.jpg" alt="Thumbnail 2" class="card-thumb">
        <div class="card-title">ดูคอนเทน</div>
        </div>
     
         <!-- การ์ดที่ 3: ใส่รูปภาพประกอบ -->
    <div class="focusable video-card" tabindex="0" data-id="2" data-url="https://www.rbtvplus18.baby/th">
        <img src="https://raw.githubusercontent.com/Nebiela/playeriptv/refs/heads/main/RB.png" alt="Thumbnail 2" class="card-thumb">
        <div class="card-title">กีฬา RBTV</div>
        </div>
     
         <!-- การ์ดที่ 4: ใส่รูปภาพประกอบ -->
    <div class="focusable video-card" tabindex="0" data-id="2" data-url="https://allinhd.com//">
        <img src="https://raw.githubusercontent.com/Nebiela/playeriptv/refs/heads/main/mo.png" alt="Thumbnail 2" class="card-thumb">
        <div class="card-title">ดูหนังออนไลน์</div>
        </div>
     
      <div id="content-grid">
         <!-- การ์ดที่ 5: ใส่รูปภาพประกอบ -->
    <div class="focusable video-card" tabindex="0" data-id="2" data-url="https://www.livescore.com/th/futbxl/live/">
        <img src="https://assets.goal.com/images/v3/blt58b301798f803f25/301977909_620275546256148_851850079260987497_n.jpg" alt="Thumbnail 2" class="card-thumb">
        <div class="card-title">สำหรับ 18+</div>
        </div>

              <!-- การ์ดที่ 6: ใส่รูปภาพประกอบ -->
    <div class="focusable video-card" tabindex="0" data-id="2" data-url="https://www.xnxx.com/">
        <img src="https://raw.githubusercontent.com/Nebiela/playeriptv/refs/heads/main/%E0%B8%89.jpg" alt="Thumbnail 2" class="card-thumb">
        <div class="card-title">สำหรับ 18+</div>
        </div>
     
    </div>

    <div id="message-box"></div>

    <script>
        // --- ระบบจัดการ Fullscreen ---
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showMessage(`เกิดข้อผิดพลาด: ${err.message}`);
                });
                fullscreenBtn.innerText = "ออกจากโหมดเต็มจอ";
            } else {
                document.exitFullscreen();
                fullscreenBtn.innerText = "เข้าสู่โหมดเต็มจอ";
            }
        });

        // --- ระบบ Spatial Navigation (การควบคุมด้วยรีโมท D-Pad) ---
        // ดึงอิลิเมนต์ทั้งหมดที่สามารถโฟกัสได้มาเก็บไว้
        const focusableElements = Array.from(document.querySelectorAll('.focusable'));
        let currentIndex = 0;

        // ฟังก์ชันตั้งค่าโฟกัส
        function setFocus(index) {
            // ลบ class focused ออกจากตัวเก่า
            focusableElements.forEach(el => el.classList.remove('focused'));
            
            // จำกัดให้อยู่ในช่วงที่มีอยู่
            if (index < 0) index = 0;
            if (index >= focusableElements.length) index = focusableElements.length - 1;
            
            currentIndex = index;
            const currentElement = focusableElements[currentIndex];
            currentElement.classList.add('focused');
            currentElement.focus();

            // เลื่อนหน้าจอตามหากส่วนนั้นโดนบัง
            currentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // เริ่มต้นด้วยการโฟกัสตัวแรก
        setFocus(currentIndex);

        // ดักจับการกดปุ่มจากรีโมท (รีโมท Android TV จะส่งค่ามาเป็น Arrow Keys และ Enter)
        document.addEventListener('keydown', (e) => {
            // ตรวจสอบว่าหน้าจอกว้างเท่าไหร่ เพื่อคำนวณการกด ลง/ขึ้น ว่าควรข้ามไปกี่คอลัมน์
            const gridColumns = getComputedStyle(document.getElementById('content-grid')).gridTemplateColumns.split(' ').length;

            switch(e.key) {
                case 'ArrowRight':
                    e.preventDefault(); // ป้องกันการเลื่อนหน้าจอปกติ
                    setFocus(currentIndex + 1);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    setFocus(currentIndex - 1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    // ถ้าอยู่ที่ปุ่มด้านบน (index 0) ให้ลงมาเนื้อหาแรก (index 1)
                    if (currentIndex === 0) {
                        setFocus(1);
                    } else {
                        // คำนวณเลื่อนลงตามจำนวนคอลัมน์
                        setFocus(currentIndex + gridColumns);
                    }
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (currentIndex > 0 && currentIndex <= gridColumns) {
                        // ถ้าอยู่แถวแรกของเนื้อหา ให้กลับไปโฟกัสปุ่มด้านบน
                        setFocus(0);
                    } else if (currentIndex > gridColumns) {
                        setFocus(currentIndex - gridColumns);
                    }
                    break;
                case 'Enter': // ปุ่ม OK บนรีโมท
                    e.preventDefault();
                    const activeElement = focusableElements[currentIndex];
                    if (activeElement === fullscreenBtn) {
                        activeElement.click(); // เรียกคำสั่ง Fullscreen
                    } else {
                        const url = activeElement.getAttribute('data-url');
                        if (url) {
                            // ถ้ามีการระบุลิงก์ใน data-url ให้เปิดเว็บนั้น
                            window.location.href = url; 
                        } else {
                            const contentId = activeElement.getAttribute('data-id');
                            showMessage(`คุณกดเลือก: เนื้อหาที่ ${contentId}`);
                        }
                    }
                    break;
            }
        });

        // ฟังก์ชันแสดงข้อความชั่วคราว
        function showMessage(text) {
            const msgBox = document.getElementById('message-box');
            msgBox.innerText = text;
            msgBox.style.display = 'block';
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 3000);
        }

        // กรณีใช้เมาส์คลิก (เพื่อรองรับการใช้งานทั่วไปด้วย)
        focusableElements.forEach((el, index) => {
            el.addEventListener('mouseover', () => setFocus(index));
            el.addEventListener('click', () => {
                setFocus(index);
                if (el !== fullscreenBtn) {
                    const url = el.getAttribute('data-url');
                    if (url) {
                        // รองรับการคลิกเมาส์ให้เปลี่ยนหน้าเช่นกัน
                        window.location.href = url;
                    } else {
                        showMessage(`คุณคลิกเลือก: เนื้อหาที่ ${el.getAttribute('data-id')}`);
                    }
                }
            });
        });
    </script>
</body>
</html>
