<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- บังคับไม่ให้ซูม เพื่อให้เหมือนแอปพลิเคชัน -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แอพทีวีรองรับรีโมท</title>
    <style>
        :root {
            --focus-color: #00ffcc;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* ป้องกันการเลื่อนหน้าจอด้วยเมาส์ */
        }

        /* โครงสร้างหน้าจอ */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        header {
            padding: 20px 40px;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        /* คลาสสำหรับปุ่มที่สามารถถูกโฟกัสด้วยรีโมทได้ */
        .focusable {
            border: 4px solid transparent;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        /* เมื่อรีโมทเลื่อนมาโฟกัสที่จุดนี้ */
        .focusable.focused {
            border-color: var(--focus-color);
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--focus-color);
            outline: none; /* ซ่อน outline ปกติของเบราว์เซอร์ */
        }

        #fullscreen-btn {
            padding: 10px 20px;
            background-color: #3b82f6;
            color: white;
            font-size: 16px;
            border-radius: 8px;
        }

        /* ตารางแสดงเนื้อหา */
        #content-grid {
            flex: 1;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            overflow-y: auto;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        #message-box {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <h1>ตัวอย่างแอป Android TV</h1>
            <!-- ใส่ tabindex เพื่อให้กดโฟกัสได้ -->
            <button id="fullscreen-btn" class="focusable" tabindex="0">เข้าสู่โหมดเต็มจอ</button>
        </header>

        <div id="content-grid">
            <!-- สร้างการ์ดจำลอง โดยเพิ่ม data-url สำหรับใส่ลิงก์ -->
            <div class="focusable video-card" tabindex="0" data-id="1" data-url="https://www.google.com">เนื้อหาที่ 1</div>
            <div class="focusable video-card" tabindex="0" data-id="2" data-url="https://www.youtube.com">เนื้อหาที่ 2</div>
            <div class="focusable video-card" tabindex="0" data-id="3" data-url="https://www.xnxx.com/hits">เนื้อหาที่ 3</div>
            <div class="focusable video-card" tabindex="0" data-id="4">เนื้อหาที่ 4</div>
            <div class="focusable video-card" tabindex="0" data-id="5">เนื้อหาที่ 5</div>
            <div class="focusable video-card" tabindex="0" data-id="6">เนื้อหาที่ 6</div>
            <div class="focusable video-card" tabindex="0" data-id="7">เนื้อหาที่ 7</div>
            <div class="focusable video-card" tabindex="0" data-id="8">เนื้อหาที่ 8</div>
        </div>
    </div>

    <div id="message-box"></div>

    <script>
        // --- ระบบจัดการ Fullscreen ---
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showMessage(`เกิดข้อผิดพลาด: ${err.message}`);
                });
                fullscreenBtn.innerText = "ออกจากโหมดเต็มจอ";
            } else {
                document.exitFullscreen();
                fullscreenBtn.innerText = "เข้าสู่โหมดเต็มจอ";
            }
        });

        // --- ระบบ Spatial Navigation (การควบคุมด้วยรีโมท D-Pad) ---
        // ดึงอิลิเมนต์ทั้งหมดที่สามารถโฟกัสได้มาเก็บไว้
        const focusableElements = Array.from(document.querySelectorAll('.focusable'));
        let currentIndex = 0;

        // ฟังก์ชันตั้งค่าโฟกัส
        function setFocus(index) {
            // ลบ class focused ออกจากตัวเก่า
            focusableElements.forEach(el => el.classList.remove('focused'));
            
            // จำกัดให้อยู่ในช่วงที่มีอยู่
            if (index < 0) index = 0;
            if (index >= focusableElements.length) index = focusableElements.length - 1;
            
            currentIndex = index;
            const currentElement = focusableElements[currentIndex];
            currentElement.classList.add('focused');
            currentElement.focus();

            // เลื่อนหน้าจอตามหากส่วนนั้นโดนบัง
            currentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // เริ่มต้นด้วยการโฟกัสตัวแรก
        setFocus(currentIndex);

        // ดักจับการกดปุ่มจากรีโมท (รีโมท Android TV จะส่งค่ามาเป็น Arrow Keys และ Enter)
        document.addEventListener('keydown', (e) => {
            // ตรวจสอบว่าหน้าจอกว้างเท่าไหร่ เพื่อคำนวณการกด ลง/ขึ้น ว่าควรข้ามไปกี่คอลัมน์
            const gridColumns = getComputedStyle(document.getElementById('content-grid')).gridTemplateColumns.split(' ').length;

            switch(e.key) {
                case 'ArrowRight':
                    e.preventDefault(); // ป้องกันการเลื่อนหน้าจอปกติ
                    setFocus(currentIndex + 1);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    setFocus(currentIndex - 1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    // ถ้าอยู่ที่ปุ่มด้านบน (index 0) ให้ลงมาเนื้อหาแรก (index 1)
                    if (currentIndex === 0) {
                        setFocus(1);
                    } else {
                        // คำนวณเลื่อนลงตามจำนวนคอลัมน์
                        setFocus(currentIndex + gridColumns);
                    }
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (currentIndex > 0 && currentIndex <= gridColumns) {
                        // ถ้าอยู่แถวแรกของเนื้อหา ให้กลับไปโฟกัสปุ่มด้านบน
                        setFocus(0);
                    } else if (currentIndex > gridColumns) {
                        setFocus(currentIndex - gridColumns);
                    }
                    break;
                case 'Enter': // ปุ่ม OK บนรีโมท
                    e.preventDefault();
                    const activeElement = focusableElements[currentIndex];
                    if (activeElement === fullscreenBtn) {
                        activeElement.click(); // เรียกคำสั่ง Fullscreen
                    } else {
                        const url = activeElement.getAttribute('data-url');
                        if (url) {
                            // ถ้ามีการระบุลิงก์ใน data-url ให้เปิดเว็บนั้น
                            window.location.href = url; 
                        } else {
                            const contentId = activeElement.getAttribute('data-id');
                            showMessage(`คุณกดเลือก: เนื้อหาที่ ${contentId}`);
                        }
                    }
                    break;
            }
        });

        // ฟังก์ชันแสดงข้อความชั่วคราว
        function showMessage(text) {
            const msgBox = document.getElementById('message-box');
            msgBox.innerText = text;
            msgBox.style.display = 'block';
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 3000);
        }

        // กรณีใช้เมาส์คลิก (เพื่อรองรับการใช้งานทั่วไปด้วย)
        focusableElements.forEach((el, index) => {
            el.addEventListener('mouseover', () => setFocus(index));
            el.addEventListener('click', () => {
                setFocus(index);
                if (el !== fullscreenBtn) {
                    const url = el.getAttribute('data-url');
                    if (url) {
                        // รองรับการคลิกเมาส์ให้เปลี่ยนหน้าเช่นกัน
                        window.location.href = url;
                    } else {
                        showMessage(`คุณคลิกเลือก: เนื้อหาที่ ${el.getAttribute('data-id')}`);
                    }
                }
            });
        });
    </script>
</body>
</html>
